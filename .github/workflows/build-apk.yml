
name: Build Naxira Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Naxira APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Accept Android SDK licenses
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses

      # 6. Check Android SDK
      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          sdkmanager --list_installed

      # 7. Check project files
      - name: Check Project Structure
        run: |
          echo "Checking Android project..."
          ls -la
          ls -la app

      # 8. Build Debug APK
      - name: Build Android APK
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      # 9. Upload APK
      - name: Upload Naxira APK
        uses: actions/upload-artifact@v4
        with:
          name: Naxira-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 10. Build summary
      - name: Build Summary
        if: success()
        run: |
          echo "## Naxira APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Your APK is ready to download." >> $GITHUB_STEP_SUMMARY
